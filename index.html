<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for sayangku&lt;3!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#fffdfb 0,transparent 28%),
    radial-gradient(circle at 90% 85%,#f2d9d3 0,transparent 32%),
    #f8eee9;
  color:#6d514c;
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

button{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 18px;
}

/* =================================================
   LOCK SCREEN
================================================= */

#lockScreen{
  overflow:hidden;
}

.lock-content{
  width:min(370px,100%);
  text-align:center;
  animation:fadeIn .8s ease;
}

.top-text{
  font-family:"Caveat",cursive;
  font-size:23px;
  color:#a8746c;
  margin-bottom:13px;
}

.lock-title{
  font-family:"Caveat",cursive;
  font-size:49px;
  line-height:1;
  font-weight:500;
  color:#6d4b46;
}

.lock-subtitle{
  font-size:11px;
  color:#9b7a74;
  margin:12px 0 28px;
}

/* Gembok */

.lock{
  position:relative;
  width:135px;
  height:150px;
  margin:0 auto 22px;
}

.lock-body{
  position:absolute;
  left:20px;
  bottom:3px;
  width:96px;
  height:84px;
  border-radius:22px;
  background:linear-gradient(145deg,#f2c6be,#e5aaa1);
  box-shadow:
    0 12px 26px rgba(100,70,65,.14),
    inset 0 2px 5px rgba(255,255,255,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}

.lock-body span{
  font-size:35px;
  color:#8a5a54;
}

.shackle{
  position:absolute;
  left:37px;
  top:14px;
  width:62px;
  height:72px;
  border:9px solid #c9857c;
  border-bottom:0;
  border-radius:35px 35px 0 0;
  transform-origin:10px 60px;
  transition:transform .75s cubic-bezier(.2,.8,.2,1);
  z-index:1;
}

.lock.open .shackle{
  transform:rotate(-38deg) translate(-7px,-7px);
}

.lock.open .lock-body{
  animation:bounce .7s ease;
}

/* PIN */

.pin{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:21px;
}

.pin-box{
  width:48px;
  height:51px;
  border-radius:11px;
  border:1px solid #e5cec8;
  background:rgba(255,255,255,.65);
  box-shadow:0 4px 13px rgba(100,70,65,.06);
  display:flex;
  align-items:center;
  justify-content:center;
}

.pin-box.filled::after{
  content:"•";
  font-size:30px;
  color:#9d655d;
}

/* keypad */

.keypad{
  width:225px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.key{
  width:61px;
  height:48px;
  border:1px solid #ead3cd;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  color:#76534e;
  font-size:16px;
  cursor:pointer;
  transition:.12s;
}

.key:active{
  transform:scale(.9);
  background:#efd8d2;
}

.delete{
  font-size:18px;
}

/* hearts */

.heart{
  position:fixed;
  z-index:100;
  pointer-events:none;
  color:#d58b82;
  animation:heartBurst 1.2s ease forwards;
}

/* =================================================
   ENVELOPE
================================================= */

#envelopeScreen{
  display:none;
  text-align:center;
  background:
    radial-gradient(circle at 50% 15%,#fffdfb 0,transparent 35%),
    #f8eee9;
}

.envelope-page{
  width:min(390px,100%);
  animation:fadeIn .8s ease;
}

.envelope-title{
  font-family:"Caveat",cursive;
  font-size:27px;
  color:#9b6962;
  margin-bottom:24px;
}

.envelope-area{
  width:min(320px,90vw);
  height:220px;
  position:relative;
  margin:auto;
  cursor:pointer;
}

/*
  IMPORTANT:
  Surat preview BENAR-BENAR disembunyikan.
  Jadi sebelum amplop dibuka tidak ada
  kertas yang nongol/tembus pandang.
*/

.envelope{
  position:absolute;
  left:0;
  bottom:15px;
  width:100%;
  height:175px;
  background:#e9bbb3;
  border-radius:4px;
  box-shadow:0 17px 35px rgba(100,65,59,.14);
  overflow:visible;
}

/* surat yang benar-benar berada DI DALAM */

.hidden-letter{
  position:absolute;
  left:9%;
  bottom:18px;
  width:82%;
  height:140px;
  background:#fffaf5;
  border-radius:2px;
  z-index:1;
  transform:translateY(20px);
  opacity:0;
  transition:
    transform 1.1s cubic-bezier(.2,.8,.2,1),
    opacity .2s;
}

/* flap */

.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:108px;
  background:#efc8c1;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}

/* bagian depan amplop */

.front{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:
    linear-gradient(33deg,transparent 49.4%,#dda9a1 50%,transparent 50.6%),
    linear-gradient(-33deg,transparent 49.4%,#dda9a1 50%,transparent 50.6%);
}

.seal{
  position:absolute;
  z-index:7;
  left:50%;
  top:75px;
  transform:translateX(-50%);
  width:43px;
  height:43px;
  border-radius:50%;
  background:#bc746c;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  transition:opacity .25s;
}

.envelope-label{
  position:absolute;
  z-index:8;
  left:0;
  right:0;
  bottom:27px;
  font-family:"Caveat",cursive;
  font-size:21px;
  color:#885952;
}

.tap-text{
  font-family:"Caveat",cursive;
  font-size:20px;
  color:#a5736c;
  margin-top:18px;
}

/* ketika dibuka */

.envelope-area.opened .flap{
  transform:rotateX(180deg);
}

.envelope-area.opened .seal{
  opacity:0;
}

.envelope-area.opened .hidden-letter{
  opacity:1;
  transform:translateY(-92px);
}

/* =================================================
   LETTER
================================================= */

#letterScreen{
  display:none;
  min-height:100vh;
  padding:45px 16px 65px;
}

.paper{
  width:min(650px,100%);
  margin:auto;
  padding:45px clamp(25px,7vw,58px) 42px;
  background:#fffaf4;
  border-radius:2px;
  box-shadow:
    0 16px 45px rgba(100,70,65,.12),
    0 2px 5px rgba(100,70,65,.05);
  position:relative;
  animation:paperIn 1s ease;
}

.paper::before{
  content:"";
  position:absolute;
  inset:11px;
  border:1px solid rgba(185,137,128,.17);
  pointer-events:none;
}

/* greeting */

.greeting{
  font-family:"Caveat",cursive;
  font-size:34px;
  font-weight:500;
  text-align:center;
  color:#875b55;
  margin-bottom:28px;
}

/* ISI SURAT
   rapi, satu garis margin,
   tidak miring
*/

.letter-body{
  width:100%;
  text-align:left;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.9;
  color:#705650;
  font-weight:400;
}

.cursor{
  display:inline-block;
  width:1px;
  height:16px;
  background:#b77b73;
  vertical-align:-2px;
  animation:blink .8s infinite;
}

/* signoff */

.signoff{
  opacity:0;
  margin-top:38px;
  text-align:left;
  font-family:"Caveat",cursive;
  color:#875a54;
  line-height:1.1;
  transition:opacity 1s ease;
}

.signoff.show{
  opacity:1;
}

.signoff-top{
  font-size:28px;
}

.signoff-name{
  font-size:30px;
  margin-top:3px;
}

/* =================================================
   BOUQUET
================================================= */

.bouquet{
  width:155px;
  height:145px;
  position:relative;
  margin:25px auto 0;
  opacity:0;
  transform:translateY(15px);
  transition:1.2s ease;
}

.bouquet.show{
  opacity:1;
  transform:translateY(0);
}

.stem{
  position:absolute;
  bottom:24px;
  left:76px;
  width:3px;
  height:88px;
  background:#87957b;
  border-radius:4px;
  transform-origin:bottom;
}

.stem.s1{transform:rotate(-20deg)}
.stem.s2{transform:rotate(-7deg)}
.stem.s3{transform:rotate(8deg)}
.stem.s4{transform:rotate(21deg)}

.flower{
  position:absolute;
  width:34px;
  height:34px;
  z-index:2;
}

.flower.f1{left:35px;top:25px}
.flower.f2{left:61px;top:8px;transform:scale(1.08)}
.flower.f3{left:91px;top:27px;transform:scale(.9)}
.flower.f4{left:63px;top:42px;transform:scale(.7)}

.petal{
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#e3aaa2;
}

.petal:nth-child(1){top:0;left:9px}
.petal:nth-child(2){top:9px;left:0}
.petal:nth-child(3){top:9px;right:0}
.petal:nth-child(4){bottom:0;left:9px}

.flower .center{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#d38b81;
  top:12px;
  left:12px;
  z-index:3;
}

.leaf{
  position:absolute;
  width:25px;
  height:12px;
  background:#a1ad96;
  border-radius:100% 0 100% 0;
  bottom:53px;
  left:40px;
  transform:rotate(-28deg);
}

.leaf.l2{
  left:91px;
  transform:scaleX(-1) rotate(-28deg);
}

.bouquet-paper{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:78px;
  height:63px;
  background:#eee0d7;
  clip-path:polygon(7% 0,93% 0,72% 100%,28% 100%);
  border-bottom:3px solid #c89a8f;
}

/* =================================================
   NEXT
================================================= */

.next-wrap{
  opacity:0;
  pointer-events:none;
  text-align:center;
  margin-top:25px;
  transition:opacity 1s ease;
}

.next-wrap.show{
  opacity:1;
  pointer-events:auto;
}

.next-button{
  width:58px;
  height:40px;
  border:none;
  border-radius:22px;
  background:#efd3cd;
  color:#805650;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(100,65,59,.1);
  animation:float 1.5s infinite ease-in-out;
}

/* =================================================
   QUESTION
================================================= */

#questionScreen{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.question-box{
  width:min(390px,100%);
  animation:fadeIn .8s ease;
}

.question-small{
  font-family:"Caveat",cursive;
  font-size:21px;
  color:#a8736b;
  margin-bottom:20px;
}

.question{
  font-family:"Caveat",cursive;
  font-size:39px;
  line-height:1.05;
  color:#6d4b46;
  margin-bottom:32px;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}

.answer{
  width:min(285px,85vw);
  min-height:53px;
  border:1px solid #e2bbb4;
  border-radius:28px;
  background:#f1d5cf;
  color:#714e49;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 6px 17px rgba(100,65,59,.09);
  transition:.2s;
}

.answer:hover{
  transform:translateY(-2px);
}

.answer:active{
  transform:scale(.96);
}

.wrong{
  animation:wrongShake .45s ease;
}

.tetot{
  height:25px;
  margin-top:18px;
  font-family:"Caveat",cursive;
  font-size:23px;
  color:#c36e66;
  opacity:0;
  transition:.3s;
}

.tetot.show{
  opacity:1;
}

/* =================================================
   FINAL
================================================= */

#finalScreen{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  position:relative;
  overflow:hidden;
}

.final-content{
  animation:finalPop 1s cubic-bezier(.2,.8,.2,1);
}

.final-text{
  font-family:"Caveat",cursive;
  font-size:clamp(43px,12vw,67px);
  line-height:.95;
  font-weight:600;
  color:#c46f68;
  animation:happyShake 1.8s infinite ease-in-out;
}

.final-heart{
  margin:30px auto 0;
  width:70px;
  height:70px;
  background:#df9188;
  transform:rotate(45deg);
  border-radius:13px;
  position:relative;
  animation:heartBeat 1.1s infinite;
}

.final-heart::before,
.final-heart::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  background:#df9188;
  border-radius:50%;
}

.final-heart::before{
  left:-35px;
}

.final-heart::after{
  top:-35px;
}

/* =================================================
   ANIMATIONS
================================================= */

@keyframes fadeIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes paperIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  40%{transform:translateY(-7px)}
  70%{transform:translateY(2px)}
}

@keyframes blink{
  50%{opacity:0}
}

@keyframes heartBurst{
  0%{
    opacity:1;
    transform:translate(0,0) scale(.5);
  }
  100%{
    opacity:0;
    transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);
  }
}

@keyframes shake{
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(7px)}
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

@keyframes finalPop{
  0%{
    opacity:0;
    transform:scale(.65);
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes happyShake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-2deg)}
  50%{transform:rotate(2deg)}
  75%{transform:rotate(-1deg)}
}

@keyframes heartBeat{
  0%,100%{transform:rotate(45deg) scale(1)}
  50%{transform:rotate(45deg) scale(1.12)}
}

@media(max-width:420px){
  .lock-title{font-size:45px}
  .letter-body{
    font-size:13.5px;
    line-height:1.85;
  }
  .paper{
    padding-left:24px;
    padding-right:24px;
  }
}
</style>
</head>

<body>

     1. LOCK

<!-- =================================================

<section id="questionScreen">

<script>

/* =================================================
   PIN
================================================= */

const correctPIN = "0310";
let enteredPIN = "";

const pinBoxes = document.querySelectorAll(".pin-box");
const lock = document.getElementById("lock");

const lockScreen =
  document.getElementById("lockScreen");

const envelopeScreen =
  document.getElementById("envelopeScreen");

const letterScreen =
  document.getElementById("letterScreen");

const questionScreen =
  document.getElementById("questionScreen");

const finalScreen =
  document.getElementById("finalScreen");


document.querySelectorAll("[data-number]").forEach(button => {

  button.addEventListener("click", () => {

    if(enteredPIN.length >= 4) return;

    enteredPIN += button.dataset.number;

    updatePIN();

    if(enteredPIN.length === 4){

      if(enteredPIN === correctPIN){

        unlock();

      }else{

        lock.classList.add("shake");

        setTimeout(() => {

          lock.classList.remove("shake");

          enteredPIN = "";

          updatePIN();

        },450);

      }

    }

  });

});


document.getElementById("delete")
.addEventListener("click", () => {

  enteredPIN =
    enteredPIN.slice(0,-1);

  updatePIN();

});


function updatePIN(){

  pinBoxes.forEach((box,index) => {

    box.classList.toggle(
      "filled",
      index < enteredPIN.length
    );

  });

}

================================================= */

function unlock(){

  lock.classList.add("open");

  createHearts(
    window.innerWidth / 2,
    window.innerHeight / 2 - 30,

  );

    lockScreen.style.display = "none";

/* =================================================
   HEART EFFECT
================================================= */

function createHearts(x,y,count){

  for(let i=0;i<count;i++){

    const h =
      document.createElement("div");

    h.className = "heart";

    h.textContent = "♥";

    h.style.left = x + "px";
    h.style.top = y + "px";

    h.style.setProperty(
      "--x",
      (Math.random()*240-120)+"px"
    );

    h.style.setProperty(
      "--y",
      (Math.random()*220-110)+"px"
    );

    h.style.setProperty(
      "--r",
      (Math.random()*80-40)+"deg"
    );

    h.style.fontSize =
      (10+Math.random()*9)+"px";

    document.body.appendChild(h);

    setTimeout(() => h.remove(),1300);

  }

}


/* =================================================
   ENVELOPE
================================================= */

const envelope =
  document.getElementById("envelope");

envelope.addEventListener("click", () => {

  if(envelope.classList.contains("opened"))
    return;

  envelope.classList.add("opened");

  createHearts(
    window.innerWidth/2,
    window.innerHeight/2,
    9
  );

  setTimeout(() => {

    envelopeScreen.style.display = "none";

    letterScreen.style.display = "block";

    window.scrollTo({
      top:0,
      behavior:"instant"
    });

    startTyping();

  },1500);

});

/* =================================================

================================================= */

function startTyping(){

  const body =
    document.getElementById("letterBody");

  const signoff =
    document.getElementById("signoff");

  const bouquet =
    document.getElementById("bouquet");

  const nextWrap =
    document.getElementById("nextWrap");

  body.innerHTML =
    '<span class="cursor"></span>';

  let index = 0;

  function type(){

    if(index < letterText.length){

      const cursor =
        body.querySelector(".cursor");

      body.insertBefore(
        document.createTextNode(
          letterText[index]
        ),
        cursor
      );

      index++;

      setTimeout(type,11);

    }else{

      const cursor =
        body.querySelector(".cursor");

      if(cursor) cursor.remove();

      setTimeout(() => {

        signoff.classList.add("show");

        setTimeout(() => {

          bouquet.classList.add("show");

          setTimeout(() => {

            nextWrap.classList.add("show");

          },900);

        },700);

      },500);

    }

  }

  type();

}
