<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 15%, #fffaf7 0, transparent 28%),
    radial-gradient(circle at 90% 80%, #f5ddd8 0, transparent 30%),
    #f8eee9;
  color: #674c47;
  font-family: "DM Sans", sans-serif;
}

button {
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 18px;
}

/* =========================
   LOCK SCREEN
========================= */

#lockScreen {
  position: relative;
  overflow: hidden;
}

.lock-content {
  width: min(360px, 100%);
  text-align: center;
  animation: appear .9s ease;
}

.top-text {
  font-family: "Caveat", cursive;
  font-size: 23px;
  color: #a8736b;
  margin-bottom: 13px;
}

.lock-title {
  font-family: "Caveat", cursive;
  font-size: 48px;
  font-weight: 500;
  line-height: 1;
  margin: 0;
  color: #6d4b46;
}

.lock-subtitle {
  font-size: 11px;
  color: #9c7c76;
  margin: 13px 0 28px;
  letter-spacing: .2px;
}

/* gembok */

.lock {
  width: 135px;
  height: 150px;
  position: relative;
  margin: 0 auto 23px;
}

.lock-body {
  position: absolute;
  width: 96px;
  height: 83px;
  left: 20px;
  bottom: 4px;
  border-radius: 21px;
  background: linear-gradient(145deg, #f2c5bc, #e4a79e);
  box-shadow:
    0 12px 25px rgba(113,75,68,.13),
    inset 0 2px 5px rgba(255,255,255,.55);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 2;
}

.lock-body span {
  color: #8b5b55;
  font-size: 34px;
}

.shackle {
  position: absolute;
  width: 62px;
  height: 72px;
  left: 37px;
  top: 14px;
  border: 9px solid #c9877d;
  border-bottom: 0;
  border-radius: 35px 35px 0 0;
  transform-origin: 10px 60px;
  transition: transform .75s cubic-bezier(.2,.8,.2,1);
  z-index: 1;
}

.lock.open .shackle {
  transform: rotate(-38deg) translate(-6px,-7px);
}

.lock.open .lock-body {
  animation: littleBounce .7s ease;
}

/* PIN */

.pin {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 22px;
}

.pin-box {
  width: 48px;
  height: 51px;
  border: 1px solid #e5cec8;
  border-radius: 11px;
  background: rgba(255,255,255,.62);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 13px rgba(100,70,65,.06);
}

.pin-box.filled::after {
  content: "•";
  font-size: 30px;
  color: #9d655d;
  line-height: 1;
}

/* KEYPAD */

.keypad {
  width: 225px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.key {
  width: 61px;
  height: 48px;
  border: 1px solid #ead3cd;
  border-radius: 50%;
  background: rgba(255,255,255,.5);
  color: #76534e;
  font-size: 16px;
  cursor: pointer;
  transition: transform .12s, background .12s;
}

.key:active {
  transform: scale(.91);
  background: #f0d8d2;
}

.delete {
  font-size: 18px;
}

/* HEART BURST */

.burst-heart {
  position: fixed;
  pointer-events: none;
  z-index: 99;
  color: #d89187;
  font-size: 16px;
  animation: burst 1.2s ease forwards;
}

/* =========================
   ENVELOPE
========================= */

#envelopeScreen {
  display: none;
  background:
    radial-gradient(circle at 50% 20%, #fffaf8, transparent 35%),
    #f8eee9;
  text-align: center;
}

.envelope-page {
  width: min(390px, 100%);
  animation: appear .9s ease;
}

.envelope-title {
  font-family: "Caveat", cursive;
  font-size: 28px;
  color: #9b6962;
  margin-bottom: 22px;
}

.envelope-area {
  width: 320px;
  max-width: 92vw;
  height: 225px;
  margin: auto;
  position: relative;
  cursor: pointer;
  perspective: 900px;
}

.envelope {
  position: absolute;
  width: 100%;
  height: 175px;
  bottom: 10px;
  left: 0;
  background: #eabcb4;
  border-radius: 4px;
  box-shadow: 0 16px 35px rgba(100,65,59,.14);
}

/* letter behind flap */

.letter-preview {
  position: absolute;
  width: 82%;
  height: 155px;
  left: 9%;
  bottom: 20px;
  background: #fffaf5;
  border-radius: 3px;
  box-shadow: 0 5px 16px rgba(100,65,59,.1);
  z-index: 1;
  transition: transform 1.15s cubic-bezier(.2,.8,.2,1);
}

.letter-preview::after {
  content: "♡";
  font-family: "Caveat";
  font-size: 20px;
  color: #c7877d;
  position: absolute;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
}

.flap {
  position: absolute;
  width: 100%;
  height: 105px;
  top: 0;
  left: 0;
  background: #efc9c2;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 1s cubic-bezier(.2,.8,.2,1);
  z-index: 4;
}

.envelope-front {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    linear-gradient(32deg, transparent 49.5%, #dfa9a1 50%, transparent 50.5%),
    linear-gradient(-32deg, transparent 49.5%, #dfa9a1 50%, transparent 50.5%);
}

.seal {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #bd756d;
  left: 50%;
  top: 77px;
  transform: translateX(-50%);
  z-index: 5;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  transition: opacity .3s;
}

.envelope-label {
  position: absolute;
  z-index: 6;
  bottom: 27px;
  left: 0;
  right: 0;
  font-family: "Caveat", cursive;
  font-size: 22px;
  color: #8d5d57;
}

.tap-text {
  margin-top: 22px;
  font-family: "Caveat", cursive;
  font-size: 20px;
  color: #a7756e;
}

.envelope-area.opened .flap {
  transform: rotateX(180deg);
}

.envelope-area.opened .seal {
  opacity: 0;
}

.envelope-area.opened .letter-preview {
  transform: translateY(-100px);
}

/* =========================
   LETTER
========================= */

#letterScreen {
  display: none;
  min-height: 100vh;
  padding: 55px 17px 70px;
}

.paper {
  width: min(650px, 100%);
  margin: auto;
  position: relative;
  padding: 43px clamp(25px, 7vw, 58px) 50px;
  background:
    linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.4)),
    #fffaf4;
  box-shadow:
    0 16px 45px rgba(100,70,65,.12),
    0 2px 5px rgba(100,70,65,.05);
  border-radius: 3px;
  animation: paperAppear 1.1s ease;
}

.paper::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(185,137,128,.18);
  pointer-events: none;
}

.greeting {
  font-family: "Caveat", cursive;
  font-size: 37px;
  color: #875b55;
  text-align: center;
  margin-bottom: 25px;
}

.letter-body {
  white-space: pre-wrap;
  font-size: 14px;
  line-height: 1.85;
  color: #705650;
  min-height: 100px;
}

.cursor {
  display: inline-block;
  width: 1px;
  height: 17px;
  background: #b77b73;
  margin-left: 2px;
  animation: blink .8s infinite;
  vertical-align: -2px;
}

.signoff {
  opacity: 0;
  margin-top: 38px;
  font-family: "Caveat", cursive;
  font-size: 26px;
  line-height: 1.2;
  color: #8d5d57;
  transition: opacity 1.2s ease;
}

.signoff.show {
  opacity: 1;
}

.name {
  font-size: 29px;
}

/* =========================
   BOUQUET
========================= */

.bouquet {
  opacity: 0;
  transform: translateY(15px);
  margin: 38px auto 0;
  width: 145px;
  height: 145px;
  position: relative;
  transition: all 1.3s ease;
}

.bouquet.show {
  opacity: 1;
  transform: translateY(0);
}

.stem {
  position: absolute;
  width: 3px;
  height: 92px;
  background: #87947c;
  bottom: 17px;
  left: 71px;
  transform-origin: bottom;
  border-radius: 3px;
}

.stem.one { transform: rotate(-17deg); }
.stem.two { transform: rotate(0deg); }
.stem.three { transform: rotate(17deg); }

.flower {
  position: absolute;
  width: 32px;
  height: 32px;
  bottom: 95px;
  left: 56px;
}

.flower.two {
  left: 40px;
  bottom: 82px;
  transform: scale(.78);
}

.flower.three {
  left: 76px;
  bottom: 82px;
  transform: scale(.78);
}

.petal {
  position: absolute;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #e5aaa1;
}

.petal:nth-child(1) { top: 0; left: 8px; }
.petal:nth-child(2) { top: 8px; left: 0; }
.petal:nth-child(3) { top: 8px; right: 0; }
.petal:nth-child(4) { bottom: 0; left: 8px; }

.center {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #d48b80;
  top: 12px;
  left: 12px;
  z-index: 2;
}

.leaf {
  position: absolute;
  width: 24px;
  height: 11px;
  background: #a2ad97;
  border-radius: 100% 0 100% 0;
  bottom: 45px;
  left: 38px;
  transform: rotate(-25deg);
}

.leaf.right {
  left: 82px;
  transform: rotate(25deg) scaleX(-1);
}

.bouquet-wrap {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 75px;
  height: 60px;
  background: #eee0d5;
  clip-path: polygon(10% 0, 90% 0, 70% 100%, 30% 100%);
  border-bottom: 3px solid #c99b8f;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes paperAppear {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes littleBounce {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(-7px); }
  70% { transform: translateY(2px); }
}

@keyframes burst {
  0% {
    opacity: 1;
    transform: translate(0,0) scale(.6);
  }
  100% {
    opacity: 0;
    transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1);
  }
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

.shake {
  animation: shake .35s ease;
}

/* mobile */

@media (max-width: 420px) {
  .lock-title {
    font-size: 44px;
  }

  .letter-body {
    font-size: 13.5px;
    line-height: 1.8;
  }

  .paper {
    padding-top: 37px;
  }
}
</style>
</head>

<script>

/* =========================
   PIN
========================= */

const correctPIN = "0310";
let enteredPIN = "";

const pinBoxes = document.querySelectorAll(".pin-box");
const lock = document.getElementById("lock");
const lockScreen = document.getElementById("lockScreen");
const envelopeScreen = document.getElementById("envelopeScreen");
const letterScreen = document.getElementById("letterScreen");

document.querySelectorAll("[data-number]").forEach(button => {

  button.addEventListener("click", () => {

    if (enteredPIN.length >= 4) return;

    enteredPIN += button.dataset.number;
    updatePIN();

    if (enteredPIN.length === 4) {

      if (enteredPIN === correctPIN) {

        unlock();

      } else {

        lock.classList.add("shake");

        setTimeout(() => {
          lock.classList.remove("shake");
          enteredPIN = "";
          updatePIN();
        }, 450);

      }

    }

  });

});


document.getElementById("delete").addEventListener("click", () => {

  enteredPIN = enteredPIN.slice(0, -1);
  updatePIN();

});


function updatePIN() {

  pinBoxes.forEach((box, index) => {

    box.classList.toggle(
      "filled",
      index < enteredPIN.length
    );

  });

}


function unlock() {

  lock.classList.add("open");

  createHearts(
    window.innerWidth / 2,
    window.innerHeight / 2 - 20,
    12
  );

  setTimeout(() => {

    lockScreen.style.display = "none";
    envelopeScreen.style.display = "flex";

  }, 1250);

}


/* =========================
   HEARTS
========================= */

function createHearts(x, y, amount) {

  for (let i = 0; i < amount; i++) {

    const heart = document.createElement("div");

    heart.className = "burst-heart";
    heart.textContent = "♥";

    heart.style.left = x + "px";
    heart.style.top = y + "px";

    heart.style.setProperty(
      "--x",
      (Math.random() * 240 - 120) + "px"
    );

    heart.style.setProperty(
      "--y",
      (Math.random() * 220 - 110) + "px"
    );

    heart.style.setProperty(
      "--r",
      (Math.random() * 80 - 40) + "deg"
    );

    heart.style.fontSize =
      (10 + Math.random() * 9) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1300);

  }

}


/* =========================
   ENVELOPE
========================= */

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", () => {

  if (envelope.classList.contains("opened")) return;

  envelope.classList.add("opened");

  createHearts(
    window.innerWidth / 2,
    window.innerHeight / 2,
    10
  );

  setTimeout(() => {

    envelopeScreen.style.display = "none";
    letterScreen.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });

    startTyping();

  }, 1550);

});

/* =========================
   TYPING EFFECT
========================= */

function startTyping() {

  const body = document.getElementById("letterBody");
  const signoff = document.getElementById("signoff");
  const bouquet = document.getElementById("bouquet");

  body.innerHTML = '<span class="cursor"></span>';

  let index = 0;

  function type() {

    if (index < letterText.length) {

      const cursor = body.querySelector(".cursor");

      const text = document.createTextNode(
        letterText[index]
      );

      body.insertBefore(text, cursor);

      index++;

      /* otomatis mengikuti tulisan */
      if (index % 35 === 0) {
        window.scrollBy({
          top: 65,
          behavior: "smooth"
        });
      }

      setTimeout(type, 13);

    } else {

      setTimeout(() => {

        const cursor = body.querySelector(".cursor");
        if (cursor) cursor.remove();

        signoff.classList.add("show");

        setTimeout(() => {

          bouquet.classList.add("show");

        }, 700);

      }, 500);

    }

  }

  type();

}

</script>
